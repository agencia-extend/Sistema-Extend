# WAHA da Extend (WhatsApp por QR Code), separado do HubSystem: contêineres e volumes com prefixo extend.
# Local por enquanto; na VPS é o mesmo arquivo (ver README).
name: extend-waha
services:
  waha:
    # Mesma versão já testada no HubSystem (digest fixo).
    image: devlikeapro/waha@sha256:0d64cce14a922f61bb9a620474086d1f5695f2522e7e1088704e6eca3a085d0c
    container_name: extend-waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3032:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY_HASH:?Defina WAHA_API_KEY_HASH no .env}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: "3600"
    volumes:
      - sessions:/app/.sessions
      - media:/app/.media

  # Túnel HTTPS para o sistema na Vercel alcançar o WAHA da máquina local (Cloudflare Quick Tunnel, sem conta).
  # O endereço muda quando o túnel reinicia; o serviço "anuncio" avisa o sistema sozinho. Na VPS, não é usado.
  tunnel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: extend-waha-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on: [waha]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://waha:3000"]

  # Avisa o sistema do endereço do túnel (assinado com a chave do WAHA). Só fala com o túnel e com o sistema.
  anuncio:
    image: node:22.11.0-alpine3.20
    container_name: extend-waha-anuncio
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on: [tunnel]
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      SITE_URL: ${SITE_URL:-https://hub.agenciaextend.com.br}
      TUNNEL_METRICS: http://tunnel:2000
    volumes:
      - ./anuncio.mjs:/anuncio.mjs:ro
    command: ["node", "/anuncio.mjs"]

volumes:
  sessions:
  media:
